name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Matrix on both OSes — the test harness spawns Prism via the Node entry
    # rather than the .cmd/.sh wrapper, but verifying on Windows too keeps
    # cross-platform regressions out.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
