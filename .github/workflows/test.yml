name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Matrix on both OSes — the test harness spawns Prism via the Node entry
    # rather than the .cmd/.sh wrapper, but verifying on Windows too keeps
    # cross-platform regressions out.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      # `npm ci` is strict about platform-specific optional deps. When the
      # lockfile is generated on one OS (Windows here) and CI runs on
      # another (ubuntu), Rollup/esbuild win/mac binaries marked optional
      # can trip it up. `npm install --no-audit --no-fund` is forgiving
      # and still uses the lockfile when consistent.
      - run: npm install --no-audit --no-fund
      - run: npm test
