name: Build add-on image

# Builds the multi-arch container image (from the root Dockerfile) and pushes
# it to GHCR so the Home Assistant add-on (bosch-shc-ui/config.yaml) can pull
# it. Tag a release to publish a versioned image:
#   git tag v0.0.1 && git push origin v0.0.1
# The git tag (v0.0.1) must match the add-on `version` (0.0.1) so HA finds the
# image. `workflow_dispatch` also publishes/refreshes the `latest` tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bosch-shc-web-ui
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 = aarch64 (RPi 3/4/5 on 64-bit HASS OS); amd64 = Intel/VM.
          # armv7 (32-bit) dropped — QEMU-emulated arm/v7 builds are flaky and
          # nearly all current HASS OS installs are 64-bit.
          platforms: linux/amd64,linux/arm64
          push: true
          # No SBOM/provenance attestations — they push extra manifest entries
          # that some registries/Supervisor image pulls choke on.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
