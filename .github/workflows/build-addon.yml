name: Build add-on image

# Builds the multi-arch container image (from the root Dockerfile) and pushes
# it to GHCR so the Home Assistant add-on (bosch-shc-ui/config.yaml) can pull
# it. Tag a release to publish a versioned image:
#   git tag v0.0.1 && git push origin v0.0.1
# The git tag (v0.0.1) must match the add-on `version` (0.0.1) so HA finds the
# image. `workflow_dispatch` also publishes/refreshes the `latest` tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Fail fast if buildkit boot or a QEMU-emulated arm64 layer stalls, instead
    # of spinning until the 6h default. A cold multi-arch build is ~15-20 min.
    timeout-minutes: 40
    # `secrets` can't be used in step `if:` — surface it via env, which can.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      # The in-app update check compares package.json against the newest tag,
      # and the add-on pulls the image by config.yaml's version — all three
      # must agree or users see a phantom (or missing) update.
      - name: Check version consistency
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          addon=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' bosch-shc-ui/config.yaml)
          echo "tag=$tag package.json=$pkg config.yaml=$addon"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$addon" ] || { echo "::error::version mismatch"; exit 1; }

      # Authenticate to Docker Hub before buildx so pulling the moby/buildkit
      # image (and base images) uses the account rate limit, not the anonymous
      # one that stalls the "booting builder" step. Skipped if no secret set.
      - if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        env:
          # GHCR reads the package description of multi-arch images from the
          # index annotations, not from image labels.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/bosch-shc-web-ui
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Bosch SHC Web UI
            org.opencontainers.image.description=Local web UI and dashboard for the Bosch Smart Home Controller (SHC I/II): history charts, energy costs, device health. No cloud.
          annotations: |
            org.opencontainers.image.title=Bosch SHC Web UI
            org.opencontainers.image.description=Local web UI and dashboard for the Bosch Smart Home Controller (SHC I/II): history charts, energy costs, device health. No cloud.

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 = aarch64 (RPi 3/4/5 on 64-bit HASS OS); amd64 = Intel/VM.
          # armv7 (32-bit) dropped — QEMU-emulated arm/v7 builds are flaky and
          # nearly all current HASS OS installs are 64-bit.
          platforms: linux/amd64,linux/arm64
          push: true
          # No SBOM/provenance attestations — they push extra manifest entries
          # that some registries/Supervisor image pulls choke on.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
