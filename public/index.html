<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bosch SHC – lokales UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style src="app.scss"></style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-white border-b sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-semibold">Bosch Smart Home</h1>
        <p id="info-line" class="text-xs text-slate-500"></p>
      </div>
      <div class="flex items-center gap-3">
        <div id="lang-switch" class="inline-flex text-[11px] border border-slate-300 rounded-md overflow-hidden">
          <button data-lang="de" class="px-2 py-1 hover:bg-slate-100">DE</button>
          <button data-lang="en" class="px-2 py-1 hover:bg-slate-100 border-l border-slate-300">EN</button>
        </div>
        <span id="event-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-slate-300"></span>
        <button id="refresh" class="text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 px-3 py-1.5 rounded-md"></button>
      </div>
    </div>
    <nav class="max-w-6xl mx-auto px-4 pb-2 flex gap-4 text-sm overflow-x-auto">
      <button data-tab="devices"   class="tab font-medium border-b-2 border-blue-600 pb-1.5"></button>
      <button data-tab="scenarios" class="tab text-slate-500 hover:text-slate-800 border-b-2 border-transparent pb-1.5"></button>
      <button data-tab="security"  class="tab text-slate-500 hover:text-slate-800 border-b-2 border-transparent pb-1.5"></button>
      <button data-tab="messages"  class="tab text-slate-500 hover:text-slate-800 border-b-2 border-transparent pb-1.5"><span data-tab-label></span> <span id="msg-badge" class="hidden ml-1 text-[10px] bg-rose-500 text-white px-1.5 rounded-full"></span></button>
      <button data-tab="admin"     class="tab text-slate-500 hover:text-slate-800 border-b-2 border-transparent pb-1.5"></button>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <section id="tab-devices"></section>
    <section id="tab-scenarios" class="hidden"></section>
    <section id="tab-security"  class="hidden"></section>
    <section id="tab-messages"  class="hidden"></section>
    <section id="tab-admin"     class="hidden"></section>
  </main>

  <!-- Modal container -->
  <div id="modal-root" class="hidden fixed inset-0 modal-bg z-20 flex items-center justify-center p-4">
    <div id="modal-card" class="bg-white rounded-lg shadow-xl max-w-md w-full p-5"></div>
  </div>

<script src="app.js"></script>
</body>
</html>
