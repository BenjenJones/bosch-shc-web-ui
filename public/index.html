<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="svg/shield-home.svg" />
  <title>Bosch SHC - lokales UI</title>
  <!-- init.js sets data-theme before paint (no FOUC); kept external so a
       strict CSP without `'unsafe-inline'` works. tailwind.css is generated
       by `npm run build:css` (prestart hook runs it for you). -->
  <script src="init.js"></script>
  <link rel="stylesheet" href="tailwind.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <!-- App shell - hidden until /api/auth/status is resolved so unauthenticated
       users never see the dashboard flash before the login overlay. -->
  <div id="app-shell" class="hidden">
  <header class="bg-white border-b sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between gap-3 sm:gap-4">
        <h1 class="text-lg font-semibold min-w-0">Bosch Smart Home</h1>
        <div class="relative shrink-0 flex items-center gap-2 sm:gap-3">
        <!-- Always visible: live-event status + primary refresh action -->
        <span id="event-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-slate-300"></span>
        <button id="refresh" class="text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 px-3 py-1.5 rounded-md"></button>

        <!-- Mobile-only hamburger; toggles #menu-panel below -->
        <button id="menu-toggle" type="button" aria-controls="menu-panel" aria-expanded="false"
          class="sm:hidden text-[11px] border border-slate-300 rounded-md px-2 py-1.5 hover:bg-slate-100">
          <span class="icon-mask align-middle" style="width:14px;height:14px;-webkit-mask-image:url(svg/menu.svg);mask-image:url(svg/menu.svg)"></span>
        </button>

        <!--
          Header controls — on ≥sm an inline row, on mobile a dropdown panel
          anchored under the hamburger. Same DOM either way, just different
          flex/positioning utilities. The mobile-only `hidden` class is what
          #menu-toggle flips in app.js.
        -->
        <div id="menu-panel"
          class="hidden flex sm:flex sm:items-center sm:gap-3
                 absolute sm:static right-0 top-full mt-2 sm:mt-0
                 flex-col sm:flex-row items-stretch gap-2
                 bg-white sm:bg-transparent
                 border border-slate-200 sm:border-0 rounded-md shadow-lg sm:shadow-none
                 p-3 sm:p-0 z-20 min-w-[160px] sm:min-w-0">
          <button id="notify-toggle" class="text-[11px] border border-slate-300 rounded-md px-2 py-1 hover:bg-slate-100">
            <span class="icon-mask align-middle" style="width:14px;height:14px;-webkit-mask-image:url(svg/bell.svg);mask-image:url(svg/bell.svg)"></span>
          </button>
          <div id="theme-switch" class="inline-flex text-[11px] border border-slate-300 rounded-md overflow-hidden">
            <button data-theme-set="light" class="flex-1 px-2 py-1 hover:bg-slate-100">
              <span class="icon-mask align-middle" style="width:14px;height:14px;-webkit-mask-image:url(svg/weather-sunny.svg);mask-image:url(svg/weather-sunny.svg)"></span>
            </button>
            <button data-theme-set="dark"  class="flex-1 px-2 py-1 hover:bg-slate-100 border-l border-slate-300">
              <span class="icon-mask align-middle" style="width:14px;height:14px;-webkit-mask-image:url(svg/weather-night.svg);mask-image:url(svg/weather-night.svg)"></span>
            </button>
          </div>
          <div id="lang-switch" class="inline-flex text-[11px] border border-slate-300 rounded-md overflow-hidden">
            <button data-lang="de" class="flex-1 px-2 py-1 hover:bg-slate-100">DE</button>
            <button data-lang="en" class="flex-1 px-2 py-1 hover:bg-slate-100 border-l border-slate-300">EN</button>
          </div>
          <button id="account-btn" class="hidden text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 px-3 py-1.5 rounded-md"></button>
        </div>
        </div>
      </div>
      <!-- Info line below the title row so it gets the full width and
           doesn't crowd the controls on narrow screens. -->
      <p id="info-line" class="text-xs text-slate-500 break-words mt-0.5"></p>
    </div>
    <!-- Mobile-only tab picker. Mirrors the <nav> below; tab-switching JS
         keeps the two in sync. Native <select> for accessibility & to avoid
         building a custom dropdown. -->
    <div class="sm:hidden max-w-6xl mx-auto px-4 pb-2">
      <select id="tab-select"
        class="w-full text-sm bg-white border border-slate-300 rounded-md px-3 py-1.5">
        <option value="devices"></option>
        <option value="scenarios"></option>
        <option value="security"></option>
        <option value="messages"></option>
        <option value="admin"    class="admin-only" hidden></option>
        <option value="users"    class="admin-only" hidden></option>
        <option value="sessions" class="admin-only" hidden></option>
      </select>
    </div>
    <nav class="hidden sm:flex max-w-6xl mx-auto px-4 pb-2 gap-4 text-sm">
      <button data-tab="devices"   class="tab font-medium border-b-2 border-blue-600 pb-1.5"></button>
      <button data-tab="scenarios" class="tab text-slate-500 hover:text-slate-800 border-b-2 border-transparent pb-1.5"></button>
      <button data-tab="security"  class="tab text-slate-500 hover:text-slate-800 border-b-2 border-transparent pb-1.5"></button>
      <button data-tab="messages"  class="tab inline-flex items-center gap-1 whitespace-nowrap text-slate-500 hover:text-slate-800 border-b-2 border-transparent pb-1.5"><span data-tab-label></span><span id="msg-badge" class="hidden text-[10px] bg-rose-500 text-white px-1.5 rounded-full leading-4"></span></button>
      <button data-tab="admin"     class="tab admin-only hidden text-slate-500 hover:text-slate-800 border-b-2 border-transparent pb-1.5"></button>
      <button data-tab="users"     class="tab admin-only hidden text-slate-500 hover:text-slate-800 border-b-2 border-transparent pb-1.5"></button>
      <button data-tab="sessions"  class="tab admin-only hidden text-slate-500 hover:text-slate-800 border-b-2 border-transparent pb-1.5"></button>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <section id="tab-devices"></section>
    <section id="tab-scenarios" class="hidden"></section>
    <section id="tab-security"  class="hidden"></section>
    <section id="tab-messages"  class="hidden"></section>
    <section id="tab-admin"     class="hidden"></section>
    <section id="tab-users"     class="hidden"></section>
    <section id="tab-sessions"  class="hidden"></section>
  </main>
  </div>

  <!-- First-run setup wizard. Shown when /api/setup/status reports
       `needed: true`. Three steps + a success screen; JS in app.js flips
       `data-step` visibility. Text content is filled from the i18n dictionary
       (DE/EN, picked from navigator.language on first visit). -->
  <div id="setup-root" class="hidden fixed inset-0 bg-slate-100 z-40 overflow-y-auto p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 border border-slate-200 mx-auto my-8">
      <h2 class="text-lg font-semibold mb-1" data-setup-text="title"></h2>
      <p class="text-xs text-slate-500 mb-4" data-setup-text="sub"></p>

      <!-- Step order is IP → auth-choice → pairing+password. Auth before
           pairing on purpose: pairing is time-sensitive (the SHC's pairing
           LED times out a few seconds after the button press), so we want
           the actual register POST to happen immediately after the user
           types the password — not after they've scrolled through three
           more screens. -->
      <div data-step="ip" class="space-y-3">
        <label for="setup-ip" class="text-xs text-slate-500 block" data-setup-text="ipLabel"></label>
        <input id="setup-ip" type="text" inputmode="decimal" placeholder="192.168.1.50" autocomplete="off" required
          class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
        <button data-step-next="ip" type="button"
          data-setup-text="next"
          class="w-full px-3 py-2 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700"></button>
      </div>

      <div data-step="auth" class="hidden space-y-3">
        <p class="text-sm" data-setup-text="authQuestion"></p>
        <p class="text-xs text-slate-500" data-setup-text-html="authHint"></p>
        <div class="flex gap-2">
          <button data-auth-choice="yes" type="button"
            data-setup-text="authYes"
            class="flex-1 px-3 py-2 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700"></button>
          <button data-auth-choice="no" type="button"
            data-setup-text="authNo"
            class="flex-1 px-3 py-2 text-sm bg-slate-100 text-slate-700 border border-slate-300 rounded-md hover:bg-slate-200"></button>
        </div>

        <div data-auth-fields class="hidden space-y-3 pt-2 border-t border-slate-200">
          <label for="setup-admin-user" class="text-xs text-slate-500 block" data-setup-text="adminUserLabel"></label>
          <input id="setup-admin-user" type="text" autocomplete="username" value="admin"
            class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
          <label for="setup-admin-pass" class="text-xs text-slate-500 block" data-setup-text="adminPassLabel"></label>
          <input id="setup-admin-pass" type="password" autocomplete="new-password" required
            class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
          <p data-setup-error class="hidden text-xs text-rose-600"></p>
          <button data-auth-confirm type="button"
            data-setup-text="next"
            class="w-full px-3 py-2 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700"></button>
        </div>
      </div>

      <div data-step="pair" class="hidden space-y-3">
        <div class="bg-amber-50 border border-amber-200 rounded-md p-3 text-xs text-amber-900" data-setup-text="pairHint"></div>
        <label for="setup-pass" class="text-xs text-slate-500 block" data-setup-text="passLabel"></label>
        <input id="setup-pass" type="password" autocomplete="off" required
          class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
        <p data-setup-error class="hidden text-xs text-rose-600"></p>
        <button data-step-next="pair" type="button"
          data-setup-text="finish"
          class="w-full px-3 py-2 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700"></button>
      </div>

      <div data-step="done" class="hidden">
        <p class="text-sm text-emerald-700" data-setup-text="done"></p>
      </div>
    </div>
  </div>

  <!-- Login overlay - populated and toggled by app.js -->
  <div id="login-root" class="hidden fixed inset-0 bg-slate-100 z-30 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-sm w-full p-6 border border-slate-200">
      <h2 id="login-title" class="text-lg font-semibold mb-1"></h2>
      <p id="login-sub" class="text-xs text-slate-500 mb-4"></p>
      <form id="login-form" class="space-y-3">
        <div>
          <label class="text-xs text-slate-500 block mb-1" id="login-user-label"></label>
          <input id="login-user" type="text" autocomplete="username" required
            class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="text-xs text-slate-500 block mb-1" id="login-pass-label"></label>
          <input id="login-pass" type="password" autocomplete="current-password" required
            class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
        </div>
        <p id="login-error" class="hidden text-xs text-rose-600"></p>
        <button id="login-submit" type="submit"
          class="w-full px-3 py-2 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700"></button>
      </form>
    </div>
  </div>

  <!-- Modal container -->
  <div id="modal-root" class="hidden fixed inset-0 modal-bg z-20 flex items-center justify-center p-4">
    <div id="modal-card" class="bg-white rounded-lg shadow-xl max-w-md w-full p-5"></div>
  </div>

<script type="module" src="js/main.js"></script>
</body>
</html>
