<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 15% 20%,#1e3a8a 0,#0f172a 55%);color:#f8fafc;position:relative}
.text{position:absolute;left:72px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:72px;height:72px}
.brand span{font-size:22px;color:#93c5fd;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
h1{font-size:64px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
p{font-size:27px;line-height:1.35;color:#cbd5e1}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips b{font-weight:600;font-size:18px;padding:7px 14px;border-radius:999px;background:rgba(37,99,235,.25);border:1px solid rgba(147,197,253,.45);color:#dbeafe}
.foot{font-size:16px;color:#64748b}
.shot{position:absolute;left:680px;top:70px;width:820px;border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(148,163,184,.25)}
.shot img{display:block;width:100%}
.shot2{left:740px;top:330px;width:520px;height:296px;background:url(history.png) -230px -196px/979px auto no-repeat}
</style></head><body>
<div class="shot"><img src="dashboard-dark.png"></div>
<div class="shot shot2"></div>
<div class="text">
  <div class="brand"><img src="icon.svg"><span>Open source · No cloud</span></div>
  <h1>Bosch SHC<br>Web UI</h1>
  <p>Local web dashboard for your Bosch Smart Home Controller — history, energy costs, device health.</p>
  <div class="chips"><b>Home Assistant add-on</b><b>Docker</b><b>Node.js</b><b>EN / DE</b></div>
  <div class="foot">Unofficial project · not affiliated with Bosch · MIT</div>
</div>
</body></html>
