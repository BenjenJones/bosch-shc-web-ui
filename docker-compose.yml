services:
  bosch-shc-ui:
    build: .
    image: bosch-shc-ui
    container_name: bosch-shc-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persists pairing (config.json), login (auth.json), client certs and the
      # message archive across restarts and image rebuilds.
      - bosch-shc-data:/data
    # SHC sits on the LAN with a routable IP, so the default bridge network is
    # enough — no host networking needed. If your SHC is only reachable via
    # mDNS/.local, add its IP to extra_hosts or use the numeric IP in setup.

volumes:
  bosch-shc-data:
